name: Claude review

# Advisory only: never add this check to branch protection.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # the action exchanges an OIDC token for a Claude GitHub App token

jobs:
  review:
    name: review
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The prompt lives in .github/claude/review.md. Edit that file to change the review,
      # not this workflow. The repo and PR number go first because the prompt refers to them.
      - name: Build prompt
        id: prompt
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "text<<PROMPT_EOF"
            echo "REPO: $REPO"
            echo "PR NUMBER: $PR_NUMBER"
            echo
            cat .github/claude/review.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
