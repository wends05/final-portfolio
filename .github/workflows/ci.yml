name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Bun installs, lints, and builds; the version comes from package.json "packageManager".
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Tests run on Node.js 24, matching the Vercel runtime (ADR 0005, ADR 0010).
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun audit
        continue-on-error: true # braces advisory has no fix yet; report, don't block

      - run: bun --bun run verify
