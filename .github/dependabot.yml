version: 2
updates:
  # npm packages, read from package.json + bun.lock
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # types must match the Node.js runtime (24 on Vercel and in CI, ADR 0005);
      # raise this bound when the runtime moves to a new major
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      # minor + patch updates arrive together in one PR;
      # major updates still get their own PR so you can read the changelog
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"

  # versions of actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
