version: 2
updates:
  # npm packages, read from package.json + bun.lock
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      # minor + patch updates arrive together in one PR;
      # major updates still get their own PR so you can read the changelog
      dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"

  # versions of actions used in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
